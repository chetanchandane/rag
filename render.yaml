# Render deployment configuration
# Docs: https://render.com/docs/render-yaml-spec

services:
  - type: web
    name: clinical-rag-api
    runtime: python
    region: oregon
    plan: free                          # upgrade to starter ($7/mo) for always-on

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      # Set these in Render dashboard → Environment → Secret Files
      # Never commit real keys to this file.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: clinical_docs
      - key: LANGCHAIN_TRACING_V2
        value: "true"
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: LANGCHAIN_PROJECT
        value: clinical-rag
