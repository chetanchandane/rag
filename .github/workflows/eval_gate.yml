name: Ragas Eval Gate

# Runs on every PR targeting main.
# Evaluates 15 examples from the golden dataset using Ragas + Claude Haiku as judge.
# Fails the PR if any metric falls below its threshold.

on:
  pull_request:
    branches: [master]

jobs:
  eval-gate:
    name: Ragas quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}
      COHERE_API_KEY:       ${{ secrets.COHERE_API_KEY }}
      QDRANT_URL:           ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY:       ${{ secrets.QDRANT_API_KEY }}
      LANGCHAIN_API_KEY:    ${{ secrets.LANGCHAIN_API_KEY }}
      LANGCHAIN_TRACING_V2: "true"
      LANGCHAIN_PROJECT:    clinical-rag-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-eval.txt

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Install eval dependencies
        run: pip install -r requirements-eval.txt

      - name: Run Ragas eval gate (CI subset — 15 examples)
        run: python -m src.evals.run_evals --dataset clinical-rag-golden-set --ci
